services:
  test-db:
    image: postgres:17-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
    profiles: [test]
    environment:
      POSTGRES_DB: papyrus_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d papyrus_test"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db:
    image: postgres:17-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
    environment:
      POSTGRES_DB: papyrus
      POSTGRES_USER: ${POSTGRES_USER:-papyrus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - papyrus-postgres-data:/var/lib/postgresql/data
    networks:
      - papyrus
    # Bound to loopback only. The application containers reach the database over
    # the compose network using the `db` hostname, which does not resolve on the
    # host. The release pipeline's `migrate` job, however, runs on the host
    # itself, so it needs a host-reachable endpoint. Binding to 127.0.0.1 keeps
    # the database off every routable interface: nothing outside the host, and
    # nothing on the public internet, can reach it, and UFW cannot be bypassed
    # because Docker never publishes on 0.0.0.0.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  admin-api:
    image: ${PAPYRUS_ADMIN_IMAGE:-papyrus-admin:local}
    build:
      context: .
      dockerfile: Dockerfile.admin
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__papyrus: Host=db;Port=5432;Database=papyrus;Username=${POSTGRES_USER:-papyrus};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      AdminApi__ApiKey: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      Media__RootPath: /data/media
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${ADMIN_PORT:-5205}:8080"
    volumes:
      - papyrus-media:/data/media
    networks:
      - papyrus
    depends_on:
      db:
        condition: service_healthy
    init: true

  blog:
    image: ${PAPYRUS_BLOG_IMAGE:-papyrus-blog:local}
    build:
      context: .
      dockerfile: Dockerfile.blog
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__papyrus: Host=db;Port=5432;Database=papyrus;Username=${POSTGRES_USER:-papyrus};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      Site__PublicBaseUrl: ${BLOG_PUBLIC_BASE_URL:?BLOG_PUBLIC_BASE_URL must be set}
      Site__MediaBaseUrl: ${MEDIA_BASE_URL:?MEDIA_BASE_URL must be set}
      Site__BlogBaseUrl: ${BLOG_PUBLIC_BASE_URL:-http://localhost:5075}
      Site__PortfolioBaseUrl: ${PORTFOLIO_PUBLIC_BASE_URL:-http://localhost:5024}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${BLOG_PORT:-5075}:8080"
    networks:
      - papyrus
    depends_on:
      admin-api:
        condition: service_started
    init: true

  portfolio:
    image: ${PAPYRUS_PORTFOLIO_IMAGE:-papyrus-portfolio:local}
    build:
      context: .
      dockerfile: Dockerfile.portfolio
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__papyrus: Host=db;Port=5432;Database=papyrus;Username=${POSTGRES_USER:-papyrus};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      Site__PublicBaseUrl: ${PORTFOLIO_PUBLIC_BASE_URL:?PORTFOLIO_PUBLIC_BASE_URL must be set}
      Site__MediaBaseUrl: ${MEDIA_BASE_URL:?MEDIA_BASE_URL must be set}
      Site__BlogBaseUrl: ${BLOG_PUBLIC_BASE_URL:-http://localhost:5075}
      Site__PortfolioBaseUrl: ${PORTFOLIO_PUBLIC_BASE_URL:-http://localhost:5024}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${PORTFOLIO_PORT:-5024}:8080"
    networks:
      - papyrus
    depends_on:
      admin-api:
        condition: service_started
    init: true

volumes:
  papyrus-postgres-data:
  papyrus-media:

networks:
  papyrus:
    driver: bridge
