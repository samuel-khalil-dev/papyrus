name: Performance baseline

on:
  workflow_dispatch:
    inputs:
      public_duration:
        description: 'K6 public duration override (for example 20s)'
        required: false
        default: '20s'

concurrency:
  group: perf-baseline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ConnectionStrings__papyrus: Host=localhost;Port=5432;Database=papyrus_test;Username=postgres;Password=postgres
      AdminApi__ApiKey: dev-admin-key
      PAPYRUS_LOAD_ADMIN_URL: http://127.0.0.1:5205
      PAPYRUS_LOAD_BLOG_URL: http://127.0.0.1:5075
      PAPYRUS_LOAD_PORTFOLIO_URL: http://127.0.0.1:5024
      PAPYRUS_LOAD_ADMIN_KEY: dev-admin-key
      PAPYRUS_LOAD_TENANT_ID: main
      # O8 release-gate re-measurement: set the production-like public base URL
      # so canonical/RSS/sitemap absolute-URL behavior is exercised, and pin the
      # dataset to the production-like seed rather than the single-post seed.
      Site__PublicBaseUrl: https://blog.example.com
      Site__MediaBaseUrl: https://admin.example.com
      Site__BlogBaseUrl: https://blog.example.com
      Site__PortfolioBaseUrl: https://portfolio.example.com
    services:
      postgres:
        image: postgres:17-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
        env:
          POSTGRES_DB: papyrus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d papyrus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065  # v1.2.1
        with:
          k6-version: 0.45.0
      - name: Install PostgreSQL client and dotnet-counters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          dotnet tool install -g dotnet-counters
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Restore
        run: dotnet restore Papyrus.sln
      - name: Build
        run: dotnet build Papyrus.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true
      - name: Start Admin API
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5205 dotnet run --project src/Papyrus.Api.Admin/Papyrus.Api.Admin.csproj --configuration Release --no-build > "$RUNNER_TEMP/papyrus-admin-baseline.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/papyrus-admin-baseline.pid"
      - name: Start Blog site
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5075 dotnet run --project src/Papyrus.Web.Blog/Papyrus.Web.Blog.csproj --configuration Release --no-build > "$RUNNER_TEMP/papyrus-blog-baseline.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/papyrus-blog-baseline.pid"
      - name: Start Portfolio site
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5024 Site__PublicBaseUrl=https://portfolio.example.com dotnet run --project src/Papyrus.Web.Portfolio/Papyrus.Web.Portfolio.csproj --configuration Release --no-build > "$RUNNER_TEMP/papyrus-portfolio-baseline.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/papyrus-portfolio-baseline.pid"
      - name: Wait for web hosts
        run: |
          for url in http://127.0.0.1:5205/health http://127.0.0.1:5075/ http://127.0.0.1:5024/; do
            for attempt in {1..45}; do
              if curl --fail --silent "$url" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "$url" > /dev/null
          done
      - name: Seed production-like dataset
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d papyrus_test -v ON_ERROR_STOP=1 -f tests/load/seed-production-like.sql
      - name: Run query budget tests
        env:
          PAPYRUS_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=papyrus_test;Username=postgres;Password=postgres
        run: dotnet test src/Papyrus.Tests/Papyrus.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~PerformanceBudgetTests --logger trx
      - name: Capture dotnet-counters during public baseline
        run: |
          dotnet-counters monitor --counters System.Runtime --interval 1s --output public-counters.txt > /dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/public-counters.pid"
          k6 run --summary-export public-summary.json tests/load/k6/public-listing.js
          kill "$(cat "$RUNNER_TEMP/public-counters.pid")" || true
      - name: Capture dotnet-counters during admin baseline
        run: |
          dotnet-counters monitor --counters System.Runtime --interval 1s --output admin-counters.txt > /dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/admin-counters.pid"
          k6 run --summary-export admin-summary.json tests/load/k6/admin-write.js
          kill "$(cat "$RUNNER_TEMP/admin-counters.pid")" || true
      - name: Upload baseline artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: papyrus-performance-baseline
          path: |
            *-summary.json
            *-counters.txt
          if-no-files-found: ignore
      - name: Stop baseline web hosts
        if: always()
        run: |
          for pid_file in "$RUNNER_TEMP"/papyrus-*-baseline.pid; do
            if test -f "$pid_file"; then kill "$(cat "$pid_file")" || true; fi
          done
