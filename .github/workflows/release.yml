name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the pipeline without publishing images, migrating, or deploying"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore Papyrus.sln
      - name: Fail on vulnerable NuGet packages
        run: |
          dotnet list Papyrus.sln package --vulnerable --include-transitive --format json > /tmp/vulnerabilities.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path('/tmp/vulnerabilities.json').read_text())

          def has_vulnerabilities(value):
              if isinstance(value, dict):
                  return any(
                      (key.lower() == 'vulnerabilities' and bool(item))
                      or has_vulnerabilities(item)
                      for key, item in value.items()
                  )
              if isinstance(value, list):
                  return any(has_vulnerabilities(item) for item in value)
              return False

          if has_vulnerabilities(document):
              raise SystemExit('Vulnerable NuGet packages detected.')
          PY
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin
            dockerfile: Dockerfile.admin
          - name: blog
            dockerfile: Dockerfile.blog
          - name: portfolio
            dockerfile: Dockerfile.portfolio
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute lowercase image prefix
        run: |
          prefix="ghcr.io/${{ github.repository }}"
          echo "IMAGE_PREFIX=${prefix,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ !inputs.dry_run }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A dry run builds but does not push, so the image only exists in the
      # runner's build cache: the reference below is not in the registry and
      # cannot be scanned or turned into an SBOM. CI's `containers` job scans
      # the same Dockerfiles, so skipping these here loses no coverage while
      # keeping the dry run from failing on a step that cannot succeed.
      - name: Scan release image
        if: ${{ !inputs.dry_run }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.ref_name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Generate SPDX SBOM
        if: ${{ !inputs.dry_run }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
      - name: Upload SBOM artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
          if-no-files-found: error

  migrate:
    needs: dependency-scan
    # Runs on the VPS via the self-hosted runner so the database stays fully
    # private (no public port 5432). The connection string's Host must resolve
    # on the VPS itself (e.g. `db` over the compose network or 127.0.0.1).
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: production-migrations
    env:
      CONNECTION_STRING: ${{ secrets.PRODUCTION_CONNECTION_STRING }}
      # Only the database's own variables. This job reconciles the db service
      # from a database-only compose file precisely so that it does not need the
      # application services' required variables.
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The migrate job connects to 127.0.0.1:5432, but that binding is declared
      # in compose and only takes effect when the service is reconciled. The
      # deploy job runs after this one, so without this step the binding is never
      # applied and the connection is refused. This uses a database-only compose
      # file so the job does not need the application services' variables.
      - name: Reconcile the database service so its port binding is applied
        run: |
          set -euo pipefail
          docker compose --file ops/deploy/docker-compose.migrate-db.yml up --detach --wait
      # No setup-dotnet step: the SDK is already installed system-wide on this
      # runner and setup-dotnet cannot install into /usr/share/dotnet as the
      # unprivileged runner user ("Permission denied"). CI uses setup-dotnet
      # because it runs on a disposable hosted image.
      # `dotnet ef` needs the projects' assets to be restored; it builds and
      # loads them, so a missing project.assets.json is NETSDK1004 rather than
      # anything to do with the database.
      - name: Restore solution
        run: dotnet restore Papyrus.sln
      # `dotnet ef` is shimmed from the global tool path, which the self-hosted
      # runner service does not export into the job PATH. `dotnet tool install
      # --global` therefore reports "already installed" while the next step
      # fails with "a dotnet-prefixed executable with this name could not be
      # found on the PATH" — this has been failing since 2026-09-09. A local
      # tool manifest is resolved relative to the checkout, so it needs no
      # ambient PATH and cannot drift with the runner's environment.
      - name: Install EF Core CLI as a local tool
        run: |
          set -euo pipefail
          dotnet new tool-manifest --force
          dotnet tool install dotnet-ef --version 10.0.11
      - name: Apply database migrations as the dedicated migration job
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          test -n "$CONNECTION_STRING"
          dotnet tool run dotnet-ef database update \
            --project src/Papyrus.Infrastructure/Papyrus.Infrastructure.csproj \
            --startup-project src/Papyrus.Api.Admin/Papyrus.Api.Admin.csproj \
            --connection "$CONNECTION_STRING"
      - name: Validate migration readiness (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          test -n "$CONNECTION_STRING"
          # Exercise the same code path the real step does. `--version` alone is
          # not enough: it never builds the projects, so it passed while
          # `database update` failed on a missing project.assets.json. Building
          # here is what makes a dry run a real rehearsal.
          dotnet build Papyrus.sln --nologo
          dotnet tool run dotnet-ef migrations list \
            --project src/Papyrus.Infrastructure/Papyrus.Infrastructure.csproj \
            --startup-project src/Papyrus.Api.Admin/Papyrus.Api.Admin.csproj \
            --connection "$CONNECTION_STRING" \
            --no-build
          echo "Dry run: connection string is configured, the solution builds, and the EF Core CLI enumerates migrations against the database; none applied."

  deploy:
    needs: [images, migrate]
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    permissions:
      contents: read
      # Required to pull the images the `images` job published to GHCR. The
      # per-job GITHUB_TOKEN is the only registry credential; see the login
      # step for why no stored secret is used.
      packages: read
    environment:
      name: production
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      BLOG_PUBLIC_BASE_URL: ${{ vars.BLOG_PUBLIC_BASE_URL }}
      PORTFOLIO_PUBLIC_BASE_URL: ${{ vars.PORTFOLIO_PUBLIC_BASE_URL }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      # Gating the OTLP exporter. The exporter stays off unless a collector
      # endpoint is configured, so a deployment without the observability stack
      # keeps structured audit logging and simply exports nothing.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute lowercase image prefix
        run: |
          prefix="ghcr.io/${{ github.repository }}"
          echo "IMAGE_PREFIX=${prefix,,}" >> "$GITHUB_ENV"
      # Compose fails with a per-service interpolation error when a required
      # variable is unset, which reads like a compose problem rather than a
      # missing repository variable. Check first and name the actual cause.
      - name: Verify required repository variables are configured
        run: |
          set -euo pipefail
          missing=""
          for name in BLOG_PUBLIC_BASE_URL PORTFOLIO_PUBLIC_BASE_URL MEDIA_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository variable(s):${missing}"
            echo "Set them under Settings -> Secrets and variables -> Actions -> Variables."
            echo "They are the absolute public origins for the blog, portfolio, and media."
            exit 1
          fi
      # The deploy job pulls the images the `images` job just pushed to GHCR
      # in this same workflow, on this same repository, using its own per-job
      # GITHUB_TOKEN. No stored credential is involved.
      #
      # Two earlier approaches were tried and abandoned. Both are recorded so
      # nobody reattempts them, and the reason matters more than the outcome:
      #
      #   1. A long-lived personal access token (GHCR_READ_TOKEN). A PAT never
      #      expires, is not attributable to a single job, and sat indefinitely
      #      in the secret store.
      #   2. A GitHub App installation token minted at run time by signing a
      #      JWT with a stored PEM key. It failed in two releases, but both
      #      failures were inside the mint step and before the registry was
      #      contacted, so the App's ability to pull was never established in
      #      either direction.
      #
      # The premise behind approach 2 was that a self-hosted runner's job token
      # could not pull from GHCR. That was never true: this workflow's own
      # `images` job pushes with exactly that token. The job token was already
      # available and sufficient, and replacing a stored credential with a
      # different stored credential was the wrong move.
      #
      # The token is scoped by `packages: read` in this job's permissions, is
      # issued per job, and expires with the run.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy only after migration and approval checks
        if: ${{ !inputs.dry_run }}
        env:
          PAPYRUS_ADMIN_IMAGE: ${{ env.IMAGE_PREFIX }}/admin:${{ github.ref_name }}
          PAPYRUS_BLOG_IMAGE: ${{ env.IMAGE_PREFIX }}/blog:${{ github.ref_name }}
          PAPYRUS_PORTFOLIO_IMAGE: ${{ env.IMAGE_PREFIX }}/portfolio:${{ github.ref_name }}
        run: docker compose --file docker-compose.yml up --detach --remove-orphans
      - name: Verify deployed services are healthy
        if: ${{ !inputs.dry_run }}
        run: |
          for url in http://127.0.0.1:5205/health http://127.0.0.1:5075/ http://127.0.0.1:5024/; do
            for attempt in {1..45}; do
              if curl --fail --silent "$url" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "$url" > /dev/null
          done

      # The observability stack is deployed from the tracked configuration in
      # ops/observability, never hand-placed on the host. The application
      # network is created by the platform compose file above, so the collector,
      # Prometheus, Grafana, and blackbox-exporter attach to it as external.
      #
      # The service names are listed explicitly and are load-bearing. This step
      # layers the observability override on top of the platform file, and
      # `up` without a service list reconciles *every* service in the merged
      # result -- including db, admin-api, blog, and portfolio. Because the
      # override renames the project, that created a second copy of the whole
      # application stack under `papyrus-observability`, which then collided
      # with the database the deploy step had just started:
      #
      #   Bind for 127.0.0.1:5432 failed: port is already allocated
      #
      # Passing `-p papyrus` would not fix it. The duplicate services would
      # still be created, just under the right project name, and would still
      # collide on the published ports. Naming the services is what actually
      # limits the step to the observability stack.
      - name: Start the observability stack
        if: ${{ !inputs.dry_run }}
        env:
          GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          docker compose \
            --file docker-compose.yml \
            --file ops/observability/docker-compose.observability.yml \
            up --detach --remove-orphans \
            otel-collector prometheus blackbox-exporter grafana

      - name: Verify the observability stack is serving
        if: ${{ !inputs.dry_run }}
        run: |
          for url in http://127.0.0.1:9090/-/healthy http://127.0.0.1:3000/api/health; do
            for attempt in {1..45}; do
              if curl --fail --silent "$url" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "$url" > /dev/null
          done
          # The alert rules must be loaded and evaluable, not merely running.
          curl --fail --silent http://127.0.0.1:9090/api/v1/rules \
            | grep --quiet PapyrusApplicationDown

      - name: Validate deployment configuration (dry run)
        if: ${{ inputs.dry_run }}
        env:
          # The compose files use required-variable syntax, so a dry run must
          # supply values to reach a real parse rather than failing on the first
          # unset placeholder. These never start a container.
          GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-dry-run}
          GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dry-run}
        run: |
          echo "Dry run: deployment configuration validated; no containers started."
          echo "Admin image:   ${{ env.IMAGE_PREFIX }}/admin:${{ github.ref_name }}"
          echo "Blog image:    ${{ env.IMAGE_PREFIX }}/blog:${{ github.ref_name }}"
          echo "Portfolio image: ${{ env.IMAGE_PREFIX }}/portfolio:${{ github.ref_name }}"
          # Fail the dry run if the observability stack would not even parse.
          docker compose \
            --file docker-compose.yml \
            --file ops/observability/docker-compose.observability.yml \
            config > /dev/null
          echo "Observability stack: ops/observability/docker-compose.observability.yml parsed."
