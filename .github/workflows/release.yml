name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the pipeline without publishing images, migrating, or deploying"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore Papyrus.sln
      - name: Fail on vulnerable NuGet packages
        run: |
          dotnet list Papyrus.sln package --vulnerable --include-transitive --format json > /tmp/vulnerabilities.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path('/tmp/vulnerabilities.json').read_text())

          def has_vulnerabilities(value):
              if isinstance(value, dict):
                  return any(
                      (key.lower() == 'vulnerabilities' and bool(item))
                      or has_vulnerabilities(item)
                      for key, item in value.items()
                  )
              if isinstance(value, list):
                  return any(has_vulnerabilities(item) for item in value)
              return False

          if has_vulnerabilities(document):
              raise SystemExit('Vulnerable NuGet packages detected.')
          PY
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin
            dockerfile: Dockerfile.admin
          - name: blog
            dockerfile: Dockerfile.blog
          - name: portfolio
            dockerfile: Dockerfile.portfolio
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute lowercase image prefix
        run: |
          prefix="ghcr.io/${{ github.repository }}"
          echo "IMAGE_PREFIX=${prefix,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ !inputs.dry_run }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A dry run builds but does not push, so the image only exists in the
      # runner's build cache: the reference below is not in the registry and
      # cannot be scanned or turned into an SBOM. CI's `containers` job scans
      # the same Dockerfiles, so skipping these here loses no coverage while
      # keeping the dry run from failing on a step that cannot succeed.
      - name: Scan release image
        if: ${{ !inputs.dry_run }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.ref_name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Generate SPDX SBOM
        if: ${{ !inputs.dry_run }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
      - name: Upload SBOM artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
          if-no-files-found: error

  migrate:
    needs: dependency-scan
    # Runs on the VPS via the self-hosted runner so the database stays fully
    # private (no public port 5432). The connection string's Host must resolve
    # on the VPS itself (e.g. `db` over the compose network or 127.0.0.1).
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: production-migrations
    env:
      CONNECTION_STRING: ${{ secrets.PRODUCTION_CONNECTION_STRING }}
      # Only the database's own variables. This job reconciles the db service
      # from a database-only compose file precisely so that it does not need the
      # application services' required variables.
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The migrate job connects to 127.0.0.1:5432, but that binding is declared
      # in compose and only takes effect when the service is reconciled. The
      # deploy job runs after this one, so without this step the binding is never
      # applied and the connection is refused. This uses a database-only compose
      # file so the job does not need the application services' variables.
      - name: Reconcile the database service so its port binding is applied
        run: |
          set -euo pipefail
          docker compose --file ops/deploy/docker-compose.migrate-db.yml up --detach --wait
      # No setup-dotnet step: the SDK is already installed system-wide on this
      # runner and setup-dotnet cannot install into /usr/share/dotnet as the
      # unprivileged runner user ("Permission denied"). CI uses setup-dotnet
      # because it runs on a disposable hosted image.
      # `dotnet ef` needs the projects' assets to be restored; it builds and
      # loads them, so a missing project.assets.json is NETSDK1004 rather than
      # anything to do with the database.
      - name: Restore solution
        run: dotnet restore Papyrus.sln
      # `dotnet ef` is shimmed from the global tool path, which the self-hosted
      # runner service does not export into the job PATH. `dotnet tool install
      # --global` therefore reports "already installed" while the next step
      # fails with "a dotnet-prefixed executable with this name could not be
      # found on the PATH" — this has been failing since 2026-09-09. A local
      # tool manifest is resolved relative to the checkout, so it needs no
      # ambient PATH and cannot drift with the runner's environment.
      - name: Install EF Core CLI as a local tool
        run: |
          set -euo pipefail
          dotnet new tool-manifest --force
          dotnet tool install dotnet-ef --version 10.0.11
      - name: Apply database migrations as the dedicated migration job
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          test -n "$CONNECTION_STRING"
          dotnet tool run dotnet-ef database update \
            --project src/Papyrus.Infrastructure/Papyrus.Infrastructure.csproj \
            --startup-project src/Papyrus.Api.Admin/Papyrus.Api.Admin.csproj \
            --connection "$CONNECTION_STRING"
      - name: Validate migration readiness (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          test -n "$CONNECTION_STRING"
          # Exercise the same code path the real step does. `--version` alone is
          # not enough: it never builds the projects, so it passed while
          # `database update` failed on a missing project.assets.json. Building
          # here is what makes a dry run a real rehearsal.
          dotnet build Papyrus.sln --nologo
          dotnet tool run dotnet-ef migrations list \
            --project src/Papyrus.Infrastructure/Papyrus.Infrastructure.csproj \
            --startup-project src/Papyrus.Api.Admin/Papyrus.Api.Admin.csproj \
            --connection "$CONNECTION_STRING" \
            --no-build
          echo "Dry run: connection string is configured, the solution builds, and the EF Core CLI enumerates migrations against the database; none applied."

  deploy:
    needs: [images, migrate]
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: production
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      BLOG_PUBLIC_BASE_URL: ${{ vars.BLOG_PUBLIC_BASE_URL }}
      PORTFOLIO_PUBLIC_BASE_URL: ${{ vars.PORTFOLIO_PUBLIC_BASE_URL }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      # Gating the OTLP exporter. The exporter stays off unless a collector
      # endpoint is configured, so a deployment without the observability stack
      # keeps structured audit logging and simply exports nothing.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute lowercase image prefix
        run: |
          prefix="ghcr.io/${{ github.repository }}"
          echo "IMAGE_PREFIX=${prefix,,}" >> "$GITHUB_ENV"
      # Compose fails with a per-service interpolation error when a required
      # variable is unset, which reads like a compose problem rather than a
      # missing repository variable. Check first and name the actual cause.
      - name: Verify required repository variables are configured
        run: |
          set -euo pipefail
          missing=""
          for name in BLOG_PUBLIC_BASE_URL PORTFOLIO_PUBLIC_BASE_URL MEDIA_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository variable(s):${missing}"
            echo "Set them under Settings -> Secrets and variables -> Actions -> Variables."
            echo "They are the absolute public origins for the blog, portfolio, and media."
            exit 1
          fi
      # A self-hosted runner's per-job GITHUB_TOKEN cannot pull from GHCR, so
      # the deploy job needs its own registry credential. The previous
      # GHCR_READ_TOKEN/GHCR_READ_USER pair was a long-lived personal access
      # token: it never expired, it was not attributable to a single job, and
      # it outlived every rotation policy we had.
      #
      # The GitHub App installation is scoped to `packages: read` on this
      # repository alone and mints a token that lives for one hour, so a
      # compromised runner has at most a one-hour window and the credential
      # disappears when the job ends. The App private key signs the JWT; it
      # never leaves the runner environment, and the token it mints is
      # narrower than the App's own key.
      - name: Mint a short-lived GitHub App installation token
        id: ghcr
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          INSTALLATION_ID: ${{ vars.APP_INSTALLATION_ID }}
          APP_SLUG: ${{ vars.APP_SLUG }}
        run: |
          set -euo pipefail
          # Diagnose before signing. This step has now failed twice, and
          # "Could not read private key" is compatible with an empty secret, a
          # truncated one, CRLF line endings, and a PEM whose body was
          # mangled in transit -- all of which OpenSSL reports identically.
          # These checks report the *shape* only and never print key material.
          if [ -z "${APP_PRIVATE_KEY:-}" ]; then
            echo "::error::APP_PRIVATE_KEY is empty. The secret is not set, or was uploaded as an empty string."
            exit 1
          fi
          key_bytes=$(printf '%s' "$APP_PRIVATE_KEY" | wc -c)
          first_line=$(printf '%s' "$APP_PRIVATE_KEY" | head -n 1)
          last_line=$(printf '%s' "$APP_PRIVATE_KEY" | tail -n 1)
          cr_count=$(printf '%s' "$APP_PRIVATE_KEY" | tr -cd '\r' | wc -c)
          echo "Key diagnostics: ${key_bytes} bytes, ${cr_count} CR characters."
          echo "First line: ${first_line}"
          echo "Last line: ${last_line}"
          case "$first_line" in
            "-----BEGIN RSA PRIVATE KEY-----"|"-----BEGIN PRIVATE KEY-----"|"-----BEGIN EC PRIVATE KEY-----")
              ;;
            *)
              echo "::error::The key does not begin with a PEM header."
              echo "Expected one of: BEGIN RSA PRIVATE KEY, BEGIN PRIVATE KEY, BEGIN EC PRIVATE KEY."
              echo "This usually means the secret was uploaded through a shell pipeline that re-encoded it."
              exit 1
              ;;
          esac
          if [ "$last_line" != "-----END RSA PRIVATE KEY-----" ] \
             && [ "$last_line" != "-----END PRIVATE KEY-----" ] \
             && [ "$last_line" != "-----END EC PRIVATE KEY-----" ]; then
            echo "::error::The key does not end with a matching PEM footer."
            echo "The secret is truncated or was altered in transit."
            exit 1
          fi

          now=$(date +%s)
          # `openssl dgst -sign` takes a *path* to a key file, not the key
          # itself. Passing the PEM text directly makes OpenSSL try to stat a
          # file named after the PEM body, which fails with "unregistered
          # scheme" and "No such file or directory" -- an error that reads like
          # a corrupt key rather than a misuse of the flag.
          key_file=$(mktemp)
          # 0600 before the secret is written, not after: the runner is a
          # persistent self-hosted host, so a world-readable key would exist
          # even briefly.
          chmod 600 "$key_file"
          printf '%s\n' "$APP_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          trap 'shred -u "$key_file" 2>/dev/null || rm -f "$key_file"' EXIT
          if ! openssl rsa -in "$key_file" -noout 2>/dev/null \
             && ! openssl pkey -in "$key_file" -noout 2>/dev/null; then
            echo "::error::OpenSSL could not parse the key material."
            echo "The PEM envelope is well formed but the body is not a valid key."
            exit 1
          fi

          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          payload=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$APP_ID" | b64)
          signature=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$key_file" | b64)
          response=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${header}.${payload}.${signature}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens")
          token=$(printf '%s' "$response" | jq --raw-output '.token // empty')
          if [ -z "$token" ]; then
            echo "::error::The GitHub App did not return an installation token."
            printf '%s' "$response" | jq --raw-output '.message // "no message"'
            exit 1
          fi
          # The mint response carries only token, expires_at, permissions, and
          # repository_selection. There is no username in it, so the registry
          # principal is the App's slug, configured as a variable.
          if [ -z "$APP_SLUG" ]; then
            echo "::error::APP_SLUG is not set."
            echo "Set it to the GitHub App's slug under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          {
            echo "username=${APP_SLUG}"
            echo 'token<<PAPYRUS_EOF'
            printf '%s' "$token"
            echo
            echo 'PAPYRUS_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.ghcr.outputs.username }}
          password: ${{ steps.ghcr.outputs.token }}
      - name: Deploy only after migration and approval checks
        if: ${{ !inputs.dry_run }}
        env:
          PAPYRUS_ADMIN_IMAGE: ${{ env.IMAGE_PREFIX }}/admin:${{ github.ref_name }}
          PAPYRUS_BLOG_IMAGE: ${{ env.IMAGE_PREFIX }}/blog:${{ github.ref_name }}
          PAPYRUS_PORTFOLIO_IMAGE: ${{ env.IMAGE_PREFIX }}/portfolio:${{ github.ref_name }}
        run: docker compose --file docker-compose.yml up --detach --remove-orphans
      - name: Verify deployed services are healthy
        if: ${{ !inputs.dry_run }}
        run: |
          for url in http://127.0.0.1:5205/health http://127.0.0.1:5075/ http://127.0.0.1:5024/; do
            for attempt in {1..45}; do
              if curl --fail --silent "$url" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "$url" > /dev/null
          done

      # The observability stack is deployed from the tracked configuration in
      # ops/observability, never hand-placed on the host. The application
      # network is created by the platform compose file above, so the collector,
      # Prometheus, Grafana, and blackbox-exporter attach to it as external.
      - name: Start the observability stack
        if: ${{ !inputs.dry_run }}
        env:
          GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          docker compose \
            --file docker-compose.yml \
            --file ops/observability/docker-compose.observability.yml \
            up --detach --remove-orphans

      - name: Verify the observability stack is serving
        if: ${{ !inputs.dry_run }}
        run: |
          for url in http://127.0.0.1:9090/-/healthy http://127.0.0.1:3000/api/health; do
            for attempt in {1..45}; do
              if curl --fail --silent "$url" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "$url" > /dev/null
          done
          # The alert rules must be loaded and evaluable, not merely running.
          curl --fail --silent http://127.0.0.1:9090/api/v1/rules \
            | grep --quiet PapyrusApplicationDown

      - name: Validate deployment configuration (dry run)
        if: ${{ inputs.dry_run }}
        env:
          # The compose files use required-variable syntax, so a dry run must
          # supply values to reach a real parse rather than failing on the first
          # unset placeholder. These never start a container.
          GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-dry-run}
          GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dry-run}
        run: |
          echo "Dry run: deployment configuration validated; no containers started."
          echo "Admin image:   ${{ env.IMAGE_PREFIX }}/admin:${{ github.ref_name }}"
          echo "Blog image:    ${{ env.IMAGE_PREFIX }}/blog:${{ github.ref_name }}"
          echo "Portfolio image: ${{ env.IMAGE_PREFIX }}/portfolio:${{ github.ref_name }}"
          # Fail the dry run if the observability stack would not even parse.
          docker compose \
            --file docker-compose.yml \
            --file ops/observability/docker-compose.observability.yml \
            config > /dev/null
          echo "Observability stack: ops/observability/docker-compose.observability.yml parsed."
