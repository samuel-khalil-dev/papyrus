name: OpenAPI schema

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: openapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.lock.json'

      - name: Restore dependencies
        run: dotnet restore Papyrus.sln

      - name: Build admin API
        run: dotnet build Papyrus.sln --configuration Release --no-restore

      - name: Start admin API for OpenAPI generation
        run: |
          ASPNETCORE_ENVIRONMENT=Development \
          ASPNETCORE_URLS=http://127.0.0.1:5205 \
          Papyrus__SkipDatabaseInitialization=true \
          dotnet run --project src/Papyrus.Api.Admin/Papyrus.Api.Admin.csproj --configuration Release --no-build > "$RUNNER_TEMP/papyrus-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/papyrus-api.pid"

      - name: Capture generated OpenAPI
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5205/openapi/v1.json -o /tmp/openapi.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/openapi.json
          python3 -c "import json; d=json.load(open('/tmp/openapi.json', encoding='utf-8')); json.dump(d, open('/tmp/openapi.sorted.json','w',encoding='utf-8'), indent=2, sort_keys=True); open('/tmp/openapi.sorted.json','a',encoding='utf-8').write('\\n')"

      - name: Compare committed OpenAPI artifact
        run: diff --strip-trailing-cr --unified=3 docs/api/openapi.json /tmp/openapi.sorted.json

      - name: Stop admin API
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/papyrus-api.pid"; then
            kill "$(cat "$RUNNER_TEMP/papyrus-api.pid")" || true
          fi
