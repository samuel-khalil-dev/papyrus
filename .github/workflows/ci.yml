name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    env:
      PAPYRUS_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=papyrus_test;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:17-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
        env:
          POSTGRES_DB: papyrus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d papyrus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Papyrus.sln

      - name: Build with warnings treated as errors
        run: dotnet build Papyrus.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Run non-integration tests
        run: dotnet test Papyrus.sln --configuration Release --no-build --no-restore --filter "FullyQualifiedName!~Papyrus.Tests.Integration" --logger trx --results-directory TestResults

      - name: Run PostgreSQL integration tests
        run: dotnet test src/Papyrus.Tests/Papyrus.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~Papyrus.Tests.Integration --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: papyrus-test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check vulnerable NuGet packages
        run: |
          dotnet list Papyrus.sln package --vulnerable --include-transitive --format json > /tmp/vulnerabilities.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path('/tmp/vulnerabilities.json').read_text())

          def has_vulnerabilities(value):
              if isinstance(value, dict):
                  return any(
                      (key.lower() == 'vulnerabilities' and bool(item))
                      or has_vulnerabilities(item)
                      for key, item in value.items()
                  )
              if isinstance(value, list):
                  return any(has_vulnerabilities(item) for item in value)
              return False

          if has_vulnerabilities(document):
              raise SystemExit('Vulnerable NuGet packages detected.')

      - name: Verify brand asset copies have not drifted
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          # Each asset is served from a different root: the documentation, the Admin SPA
          # bundle, and the public hosts' shared static web assets. The copies are
          # structural, so the invariant that is enforced is that they stay byte-identical
          # to the canonical source. See docs/01-product/brand-identity.md.
          GROUPS = {
              'Papyrus_Logo.svg': (
                  'src/Papyrus.Web.Shared/wwwroot/images/Papyrus_Logo.svg',
                  'src/Papyrus.Admin.UI/public/Papyrus_Logo.svg',
                  'docs/assets/Papyrus_Logo.svg',
              ),
              'Papyrus_Background.svg': (
                  'src/Papyrus.Web.Shared/wwwroot/images/Papyrus_Background.svg',
                  'src/Papyrus.Admin.UI/src/assets/Papyrus_Background.svg',
                  'docs/assets/Papyrus_Background.svg',
              ),
              'favicon.ico': (
                  'src/Papyrus.Web.Blog/wwwroot/favicon.ico',
                  'src/Papyrus.Web.Portfolio/wwwroot/favicon.ico',
              ),
          }

          drifted = []
          for asset, (canonical, *copies) in GROUPS.items():
              expected = Path(canonical).read_bytes()
              for candidate in copies:
                  if Path(candidate).read_bytes() != expected:
                      drifted.append((asset, canonical, candidate))

          if drifted:
              print('Brand asset copies have drifted from their canonical source:')
              for asset, canonical, candidate in drifted:
                  print(f'  {candidate} no longer matches {canonical} ({asset})')
              sys.exit(1)

          print('Brand asset copies are identical to their canonical source.')
          PY

      - name: Verify the documented test baseline matches this run
        run: |
          python3 - <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          # The test figures published in docs/00-overview/feature-matrix.md are
          # derived here from the TRX files the two steps above already wrote,
          # rather than restated by hand, so they cannot silently go stale. The
          # numbers live in exactly one machine-readable marker; the prose
          # elsewhere must quote the same figures, which is checked too.
          NAMESPACE = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          INTEGRATION_PREFIX = 'Papyrus.Tests.Integration.'
          ENCODING_CLASS = 'Papyrus.Tests.SourceEncodingTests.'
          MARKER = re.compile(r'<!--\s*test-baseline:\s*(?P<body>.*?)\s*-->', re.DOTALL)

          # xUnit on the VSTest logger emits Passed, Failed and NotExecuted
          # (skipped or filtered). A skipped case is silently reduced coverage,
          # so anything that is not Passed is treated as a failure.
          NOT_PASSED = {
              'NotExecuted', 'Inconclusive', 'Timeout', 'Aborted',
              'Error', 'Warning', 'Failed',
          }

          # Every document that restates a figure from the canonical marker, and
          # WHICH figures it must quote -- named by the marker's own keys, never
          # by value. Three independent restatements of the same figures is how
          # a three-case drift survived review once, so all of them are checked
          # rather than the marker alone.
          #
          # An earlier version of this check pinned the expected numbers here as
          # string literals and only asserted that each literal appeared
          # somewhere in the file. That cannot detect the drift it was written
          # for: when the suite moved 454 -> 456, the pinned 454 was still
          # present in the prose, so the check passed while the documents
          # disagreed with the run and with the marker. Deriving the expected
          # value from the marker means a restatement is compared against what
          # the run actually measured, and the numbers are written down in
          # exactly one place.
          #
          # The keys are the marker's. Adding a figure to the marker does not
          # require touching this table; adding a restatement does.
          RESTATEMENTS = {
              'docs/README.md': (
                  'non-integration', 'encoding', 'behavioural',
                  'integration', 'total', 'behaviour-total', 'playwright',
              ),
              'docs/00-overview/limitations.md': (
                  'non-integration', 'encoding', 'behavioural',
                  'integration', 'total', 'behaviour-total', 'playwright',
              ),
              'docs/Papyrus_Roadmap.md': (
                  'non-integration', 'encoding', 'behavioural',
                  'integration', 'total', 'behaviour-total', 'playwright',
              ),
          }

          trx_files = sorted(Path('TestResults').rglob('*.trx'))
          if len(trx_files) != 2:
              sys.exit(
                  f'Expected 2 TRX files from the two dotnet test steps, '
                  f'found {len(trx_files)}: {[p.name for p in trx_files]}'
              )

          non_integration = integration = encoding = 0
          not_passed = []
          for trx in trx_files:
              for result in ET.parse(trx).iter(f'{NAMESPACE}UnitTestResult'):
                  name = result.get('testName', '')
                  # The two steps differ only by --filter, so the namespace
                  # prefix is the runner's own split and cannot drift from it.
                  if name.startswith(INTEGRATION_PREFIX):
                      integration += 1
                  else:
                      non_integration += 1
                      if name.startswith(ENCODING_CLASS):
                          encoding += 1
                  if result.get('outcome', '') in NOT_PASSED:
                      not_passed.append(f"{name} [{result.get('outcome', '')}]")

          if not_passed:
              print('Test cases that did not pass:')
              for entry in sorted(not_passed):
                  print(f'  {entry}')
              sys.exit(1)

          measured = {
              'non-integration': non_integration,
              'integration': integration,
              'total': non_integration + integration,
              'encoding': encoding,
              'behavioural': non_integration - encoding,
              'behaviour-total': non_integration - encoding + integration,
              'playwright': sum(
                  len(re.findall(r'^\s*test\(', path.read_text(encoding='utf-8'), re.MULTILINE))
                  for path in sorted(Path('tests/e2e').glob('*.spec.ts'))
              ),
          }

          matrix = Path('docs/00-overview/feature-matrix.md')
          match = MARKER.search(matrix.read_text(encoding='utf-8'))
          if match is None:
              sys.exit(f"No '<!-- test-baseline: ... -->' marker in {matrix.as_posix()}")

          recorded = {
              key: int(value)
              for key, value in re.findall(r'([a-z-]+)=(\d+)', match.group('body'))
          }

          absent = sorted(set(measured) - set(recorded))
          if absent:
              print('The test-baseline marker is missing figures: '
                    + ', '.join(absent))
              sys.exit(1)

          # The marker is the only place a figure is written down, so a marker
          # that has fallen behind the run is a different defect from prose that
          # has: here the marker is what needs editing, and the documents below
          # still quote the right figure. `recorded` cannot have a `None` for any
          # measured key -- the `absent` guard above has already exited on that
          # -- so the pair is always both sides of a disagreement.
          drift = [
              (key, value, recorded.get(key))
              for key, value in measured.items()
              if recorded.get(key) != value
          ]

          # Operator experience, not coverage: every row below this one already
          # reaches `drift` as a measured/recorded disagreement, so this guard
          # adds no correctness of its own. It exists so the marker-drift case
          # fails with the name of the figure rather than a bare KeyError.

          # A restatement is checked against the figure the run measured, not
          # against the marker. Comparing the two sources transitively would let
          # a wrong-but-consistent marker excuse wrong prose, and this check
          # exists precisely to catch a document nobody re-read.
          #
          # KNOWN LIMITATION: this asks whether a figure appears anywhere in a
          # document, not whether it appears in the sentence that states it, and
          # it does not check the sentence either. So a document that drops a
          # restatement still passes if the same number occurs elsewhere in the
          # file for an unrelated reason, and a document that quotes the right
          # figure once and a wrong one elsewhere has the same problem. That is
          # reachable today: `457` occurs twice in Papyrus_Roadmap.md, so the
          # sentence stating it can be deleted and this check still passes. No
          # boundary can fix it -- the number is genuinely present -- only
          # tying a figure to the claim that carries it, which means parsing
          # prose per figure and rewriting the table every time a sentence is
          # reworded. The drift this guard was written for -- a suite change
          # that moves a figure and leaves the documents behind -- is caught, and
          # so are the identifier-shaped tokens the boundary below rejects,
          # which is where the collisions actually came from.
          #
          # Exposure is a property of the document, not of the digit count of the
          # figure. Two of the seven figures are two digits (`playwright` and
          # `integration`), but a three-digit figure is just as satisfiable by an
          # unrelated number if the document happens to contain one -- a year,
          # a line count, a milestone span. Tightening the boundary below is
          # what reduces exposure, and it can only go so far.
          #
          # The boundary has to model what a number *is* in this corpus, not
          # just where a digit run starts. `\w` covers letters, digits and
          # underscore, so a digit glued to a word character is not a figure.
          # `-` and `#` join the left class because the figure-shaped tokens in
          # these documents are identifiers, not numbers: `ADR-0010`, the
          # `M0`..`M32` milestone labels, the `O10` risk register. Accepting
          # those makes the guard unfailable -- deleting the real `playwright`
          # restatement left ADR-0010, M10 and O10 standing in for it, and
          # `integration` was satisfied by any of M0..M32. `[` is in the class
          # on both sides, so an `ADR-0010` cannot enter through its link text
          # either.
          #
          # `-` is deliberately NOT in the right class. It looks harmless and is
          # not: it rejects a figure glued to a hyphen, and Papyrus_Roadmap.md
          # states the browser-suite figure as `10-test Playwright`. The left
          # rule already blocks `M10` and `ADR-0010` on the character preceding
          # the digits, so excluding `-` on the right buys nothing and costs a
          # false failure on a correct document.
          #
          # A trailing period is a residual gap. `456.` at the end of a sentence
          # is indistinguishable from `1.456` to this pattern, so it is
          # rejected. That is latent only because no document currently ends a
          # figure with a period; the first edit that writes "... 456." fails
          # here, and the fix belongs in the prose, not in the boundary.
          NUMBER = re.compile(r'(?<![\w.\-#\]])(\d+)(?![\w.\]])')

          def quoted(body: str, value: int) -> bool:
              return any(int(match.group(1)) == value for match in NUMBER.finditer(body))

          # A key named in RESTATEMENTS that this run does not produce would
          # otherwise raise KeyError below and surface as a traceback, which
          # tells the reader nothing about which table to edit.
          unknown = sorted(
              {key for keys in RESTATEMENTS.values() for key in keys} - set(measured)
          )
          if unknown:
              print(
                  'RESTATEMENTS names figures this run does not produce: '
                  + ', '.join(unknown)
                  + '\nThe figures this run produces are: '
                  + ', '.join(sorted(measured))
                  + '\nUse one of those names, or add the figure to `measured` first.'
              )
              sys.exit(1)

          for path, keys in RESTATEMENTS.items():
              body = Path(path).read_text(encoding='utf-8')
              wrong = [
                  f"{key}={measured[key]} (marker says {recorded[key]})"
                  for key in keys
                  if not quoted(body, measured[key])
              ]
              if wrong:
                  drift.append((path, 'stale or missing figure: ' + '; '.join(wrong), None))

          if drift:
              print('The documented test baseline does not match this run.\n')
              # Two kinds of row, so they are labelled rather than left to be
              # inferred from a key that is sometimes a figure name and
              # sometimes a path. The label column is sized to the labels alone
              # (12 characters) instead of across the whole table, so a
              # 30-character document path cannot set the width for a
              # three-character figure name.
              rows = []
              marker_stale = False
              for key, value, recorded_value in drift:
                  if recorded_value is None:
                      rows.append(('restatement', f'{key}: {value}'))
                  else:
                      marker_stale = True
                      rows.append(
                          ('marker', f'{key}={value} (marker says {recorded_value})')
                      )
              width = max(len(label) for label, _ in rows)
              for label, detail in rows:
                  print(f'  {label.ljust(width)}  {detail}')
              print()
              if marker_stale:
                  # When the marker is stale, the marker is the thing to fix and
                  # it is the one place the figure is written down; every
                  # restatement flagged alongside it will follow once it is
                  # corrected, so naming it is all the operator has to do. When
                  # the marker is correct, the prose is what moved.
                  print(
                      'The figures marked `marker` are the stale ones. Correct the '
                      "'<!-- test-baseline: ... -->' marker in "
                      'docs/00-overview/feature-matrix.md to the measured values.'
                      '\nEvery `restatement` flagged here quotes a figure this run '
                      'measured and the marker did not, so it will be satisfied by '
                      'the marker correction alone -- edit the documents for the '
                      'figures already in the marker, and for these only if the '
                      'measured value is genuinely the new one.'
                  )
              else:
                  print(
                      'The marker is correct; only the prose is behind. The rows '
                      'marked `restatement` are the documents that do not quote '
                      'the figures this run measured.'
                      '\nUpdate each document listed, and leave the marker in '
                      'docs/00-overview/feature-matrix.md alone.'
                  )
              print(
                  '\nThe test suite ran cleanly; only the documentation is behind. '
                  'Keep the figures quoted in docs/README.md, '
                  'docs/00-overview/limitations.md and docs/Papyrus_Roadmap.md in '
                  'step with the marker.'
                  '\n\nA figure is satisfied only by a standalone number: a digit '
                  'inside a longer number does not count, so 17 is not found in '
                  '176, and an identifier that merely contains the digits -- '
                  'ADR-0010, M10, O10 -- does not count either.'
                  '\n\nEncoding cases move with the source tree: every tracked '
                  '.cs/.csproj/.json/.props/.targets/.md file is one '
                  'SourceEncodingTests case, so adding or deleting any file -- not '
                  'only any test -- changes both \'total\' and \'encoding\'. That is '
                  'expected; update the marker in the same change.'
              )
              sys.exit(1)

          print('Test baseline matches this run: ' + ', '.join(
              f'{key}={value}' for key, value in measured.items()))
          PY

  browser-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ConnectionStrings__papyrus: Host=localhost;Port=5432;Database=papyrus_test;Username=postgres;Password=postgres
      AdminApi__ApiKey: dev-admin-key
      PAPYRUS_E2E_ADMIN_KEY: dev-admin-key
      PAPYRUS_E2E_ADMIN_URL: http://127.0.0.1:5205
      PAPYRUS_E2E_BLOG_URL: http://127.0.0.1:5075
      PAPYRUS_E2E_PORTFOLIO_URL: http://127.0.0.1:5024
    services:
      postgres:
        image: postgres:17-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
        env:
          POSTGRES_DB: papyrus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d papyrus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            src/Papyrus.Admin.UI/package-lock.json
            tests/e2e/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore Papyrus.sln

      - name: Build .NET projects
        run: dotnet build Papyrus.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Build Admin UI
        run: npm ci --prefix src/Papyrus.Admin.UI

      - name: Compile Admin UI
        run: npm run build --prefix src/Papyrus.Admin.UI

      - name: Check Admin UI bundle budget
        run: npm run check:bundle --prefix src/Papyrus.Admin.UI

      - name: Install browser test dependencies
        run: npm ci --prefix tests/e2e

      - name: Install Chromium
        run: npx --prefix tests/e2e playwright install --with-deps chromium

      - name: Start Admin API
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5205 dotnet run --project src/Papyrus.Api.Admin/Papyrus.Api.Admin.csproj --configuration Release --no-build > "$RUNNER_TEMP/papyrus-admin.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/papyrus-admin.pid"

      - name: Start Blog site
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5075 dotnet run --project src/Papyrus.Web.Blog/Papyrus.Web.Blog.csproj --configuration Release --no-build > "$RUNNER_TEMP/papyrus-blog.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/papyrus-blog.pid"

      - name: Start Portfolio site
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5024 dotnet run --project src/Papyrus.Web.Portfolio/Papyrus.Web.Portfolio.csproj --configuration Release --no-build > "$RUNNER_TEMP/papyrus-portfolio.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/papyrus-portfolio.pid"

      - name: Wait for web apps
        run: |
          for url in http://127.0.0.1:5205/health http://127.0.0.1:5075/ http://127.0.0.1:5024/; do
            for attempt in {1..45}; do
              if curl --fail --silent "$url" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "$url" > /dev/null
          done

      - name: Run browser smoke tests
        run: npm run test:e2e --prefix tests/e2e

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: papyrus-browser-smoke-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore

  load-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ConnectionStrings__papyrus: Host=localhost;Port=5432;Database=papyrus_test;Username=postgres;Password=postgres
      AdminApi__ApiKey: dev-admin-key
      PAPYRUS_LOAD_ADMIN_URL: http://127.0.0.1:5205
      PAPYRUS_LOAD_BLOG_URL: http://127.0.0.1:5075
      PAPYRUS_LOAD_PORTFOLIO_URL: http://127.0.0.1:5024
      PAPYRUS_LOAD_ADMIN_KEY: dev-admin-key
      PAPYRUS_LOAD_TENANT_ID: main
    services:
      postgres:
        image: postgres:17-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
        env:
          POSTGRES_DB: papyrus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d papyrus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        run: dotnet restore Papyrus.sln

      - name: Build .NET projects
        run: dotnet build Papyrus.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Start Admin API
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5205 dotnet run --project src/Papyrus.Api.Admin/Papyrus.Api.Admin.csproj --configuration Release --no-build > "$RUNNER_TEMP/papyrus-admin-load.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/papyrus-admin-load.pid"

      - name: Start Blog site
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5075 dotnet run --project src/Papyrus.Web.Blog/Papyrus.Web.Blog.csproj --configuration Release --no-build > "$RUNNER_TEMP/papyrus-blog-load.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/papyrus-blog-load.pid"

      - name: Start Portfolio site
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5024 dotnet run --project src/Papyrus.Web.Portfolio/Papyrus.Web.Portfolio.csproj --configuration Release --no-build > "$RUNNER_TEMP/papyrus-portfolio-load.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/papyrus-portfolio-load.pid"

      - name: Wait for web apps
        run: |
          for url in http://127.0.0.1:5205/health http://127.0.0.1:5075/ http://127.0.0.1:5024/; do
            for attempt in {1..45}; do
              if curl --fail --silent "$url" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "$url" > /dev/null
          done

      - name: Set up K6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1  # v1.2.2
        with:
          # Pin the same version perf-baseline.yml uses, so load-smoke results are
          # comparable with the archived evidence in docs/history. Left unpinned,
          # this job tracked the action's default and moved whenever the action
          # was bumped.
          k6-version: 0.45.0

      - name: Run public K6 load smoke
        run: k6 run tests/load/k6/public-listing.js

      - name: Run admin K6 load smoke
        run: k6 run tests/load/k6/admin-write.js

      - name: Stop load-test web apps
        if: always()
        run: |
          for pid_file in "$RUNNER_TEMP"/papyrus-*-load.pid; do
            if test -f "$pid_file"; then kill "$(cat "$pid_file")" || true; fi
          done

  containers:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin
            dockerfile: Dockerfile.admin
          - name: blog
            dockerfile: Dockerfile.blog
          - name: portfolio
            dockerfile: Dockerfile.portfolio
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container image
        run: docker build --pull --file "${{ matrix.dockerfile }}" --tag "papyrus-${{ matrix.name }}:ci" .

      - name: Scan container image for high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: papyrus-${{ matrix.name }}:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
