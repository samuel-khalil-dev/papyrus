# Observability stack for the Papyrus platform.
#
# This file is a compose *override* target deployed by the release workflow, not
# a hand-managed host configuration. It is layered on top of the platform
# network created by docker-compose.yml so the collector can reach the
# application containers by service name.
#
# Nothing here is published to the host on a routable interface: every port is
# bound to loopback so UFW cannot be bypassed by Docker. Grafana is the only
# human-facing surface and stays private.
#
# Deploy with:
#   docker compose -f docker-compose.yml -f ops/observability/docker-compose.observability.yml up -d
#
# Collector configuration is ops/observability/collector/config.yaml and the
# alert rules are ops/observability/prometheus/papyrus-alerts.yml. The dashboard
# is the tracked definition in docs/observability/dashboards/.

# Bind paths are resolved against the directory of the FIRST compose file, not
# this one, and the release workflow runs from the repository root. Keep them
# repo-root relative.

name: papyrus-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.129.1@sha256:4798e3095561ac8ae13a81965088d68b943b1991bbeede91b1564e12c95372cc
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/observability/collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      # gRPC and HTTP OTLP receivers, loopback only. The application containers
      # reach the collector over the platform network, not through this port.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      # The Prometheus exporter. Prometheus scrapes it over the platform network.
      - "127.0.0.1:8889:8889"
    networks:
      - papyrus
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Retention is the O4 gate: audit and telemetry signals are retained for
      # the platform compliance window, not for the Prometheus default of 15d.
      - "--storage.tsdb.retention.time=${OBSERVABILITY_RETENTION:-30d}"
      - "--web.enable-lifecycle"
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/papyrus-alerts.yml:/etc/prometheus/papyrus-alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - papyrus
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0@sha256:a50c4c0eda297baa1678cd4dc4712a67fdea713b832d43ce7fcc5f9bea05094d
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./ops/observability/blackbox-exporter/config.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - papyrus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000/
      # The dashboard is a private operational surface; do not let external
      # providers phone home or load remote assets.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - papyrus
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

networks:
  papyrus:
    external: true
    name: papyrus_papyrus
